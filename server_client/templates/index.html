<!DOCTYPE html>
<html>
<head>
    <title>Info Board Controller</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Info Board Controller</h1>
    
    <div class="container">
        <div style="display: flex; gap: 20px; align-items: flex-start;">
            <div>
                <div style="display: flex; gap: 20px;">
                    <div>
                        <label>Display:</label><br>
                        <textarea id="message" rows="1" cols="25" maxlength="25" placeholder="Row 1" class="display-row"></textarea>
                        <textarea id="message" rows="1" cols="25" maxlength="25" placeholder="Row 2" class="display-row"></textarea>
                        <textarea id="message" rows="1" cols="25" maxlength="25" placeholder="Row 3" class="display-row"></textarea>
                        <textarea id="message" rows="1" cols="25" maxlength="25" placeholder="Row 4" class="display-row"></textarea>
                        <textarea id="message" rows="1" cols="25" maxlength="25" placeholder="Row 5" class="display-row"></textarea>
                        <textarea id="message" rows="1" cols="25" maxlength="25" placeholder="Row 6" class="display-row"></textarea>
                        <textarea id="message" rows="1" cols="25" maxlength="25" placeholder="Row 7" class="display-row"></textarea>
                    </div>
                    <div>
                        <label>To display:</label><br>
                        <textarea id="sent-output" rows="7" cols="25" readonly>{{ to_display }}</textarea>
                        <label>Next command:</label><br>
                        <textarea id="next-command" rows="1" cols="25" readonly>{{ command_to_send }}</textarea>
                    </div>
                </div>
                <button onclick="get_display_message()">Display on Info Board</button>
            </div>

            <div style="margin-left: 20px; padding-left: 20px;">
                <label>Commands:</label><br>
                <button class="secondary-btn" onclick="get_command('reboot')" style="margin-left:10px;">Reboot</button>
                <button class="secondary-btn" onclick="get_command('')" style="margin-left:10px;">Clear CMD</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div>
            <label>Logs:</label><br>
            <div style="display: flex; gap: 10px; align-items: flex-start;">
                <pre id="logs" style="flex: 1; min-height:120px; height:350px; overflow:auto; background:#fff; border-radius:4px; border:1px solid #ccc; padding:10px; font-family:monospace; white-space:pre-wrap; word-break:break-all; margin: 0;"></pre>
                <button class="secondary-btn" onclick="clear_logs()" style="margin: 0;">Clear Logs</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
